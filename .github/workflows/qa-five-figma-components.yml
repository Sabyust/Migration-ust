name: QA five Figma-mapped React components
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/figma/fiveComponents.*'
      - 'scripts/qa_five_figma_components.mjs'
      - 'component-lab.html'
      - 'vite.config.js'
      - '.github/workflows/qa-five-figma-components.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build all site routes
        run: npm run build
      - name: Serve built preview
        run: |
          (npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ust-component-lab.log 2>&1 &)
          for n in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/Migration-ust/component-lab.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/ust-component-lab.log
          exit 1
      - name: Test Figma frame contracts and component interactions
        run: node scripts/qa_five_figma_components.mjs
      - name: Upload component QA details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-figma-components-qa
          path: component-qa-output/
          if-no-files-found: warn
          retention-days: 7
