name: Validate Figma components against GitHub page
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build and serve GitHub page locally
        run: |
          npm run build
          (npx vite preview --host 127.0.0.1 --port 4173 > /tmp/ust-vite.log 2>&1 &)
          for n in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/Migration-ust/our-approach-mapped/; then break; fi
            sleep 1
          done
      - name: Validate Figma component contracts against rendered DOM
        run: node scripts/validate_component_contract.mjs
      - name: Upload component compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-component-contract
          path: component-qa-output/
          if-no-files-found: warn
          retention-days: 7
